<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
    
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="Home.html">
                <img src="img/Logo.png" alt="logo" height="40">
                <span class="fw-bold">CLstore</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0 fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="Home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="Productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="Nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="Blogs.html">Blogs</a></li>
                    <li class="nav-item"><a class="nav-link" href="Contacto.html">Contacto</a></li>
                    <li><a class="nav-link" href="Registro.html">Registrate</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <div class="container my-5">
        <h2 class="fw-bold mb-4"><i class="fa-solid fa-cart-shopping me-2"></i>Tu Carrito</h2>

        <div class="row g-4">

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 p-3">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>Producto</th>
                                    <th>Precio</th>
                                    <th style="width: 130px;">Cantidad</th>
                                    <th>Subtotal</th>
                                    <th class="text-end">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="cart-items">

                            </tbody>
                        </table>
                    </div>

                    <div id="cart-empty" class="text-center py-5 d-none">
                        <i class="fa-solid fa-cart-flatbed-suitcases fa-3x text-muted mb-3"></i>
                        <p class="fs-5 text-muted">Tu carrito está vacío.</p>
                        <a href="Productos.html" class="btn btn-primary rounded-pill">Ver Productos</a>
                    </div>
                </div>
            </div>


            <div class="col-lg-4">
                <div class="card card-summary shadow-sm p-4">
                    <h5 class="fw-bold mb-4">Resumen del Pedido</h5>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Subtotal:</span>
                        <span id="summary-subtotal" class="fw-semibold">$0</span>
                    </div>
                    <div class="d-flex justify-content-between mb-2">
                        <span class="text-muted">Envío:</span>
                        <span class="text-success fw-semibold">Gratis</span>
                    </div>
                    <hr>
                    <div class="d-flex justify-content-between mb-4 fs-5">
                        <span class="fw-bold">Total:</span>
                        <span id="summary-total" class="fw-bold text-primary">$0</span>
                    </div>
                    <button id="btn-checkout" class="btn btn-primary rounded-pill w-100 py-2 fw-bold" onclick="realizarCompra()">
                        PAGAR
                    </button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    

    <script src="JS/scripts.js"></script>
</body>
</html>
